              void backup() {

                  try {

                      File dir =
                          getExternalFilesDir(
                              "backup"
                          );

                      if (dir == null)
                          throw new Exception();

                      if (!dir.exists())
                          dir.mkdirs();

                      File file =
                          new File(
                              dir,
                              "daftar-backup.txt"
                          );

                      FileWriter w =
                          new FileWriter(file);

                      Cursor t =
                          db.allTasks();

                      while (t.moveToNext()) {

                          w.write(
                              "TASK|" +
                              t.getLong(0) +
                              "|" +
                              esc(t.getString(1)) +
                              "|" +
                              esc(t.getString(2)) +
                              "|" +
                              esc(t.getString(3)) +
                              "|" +
                              esc(t.getString(4)) +
                              "|" +
                              esc(t.getString(5)) +
                              "|" +
                              esc(t.getString(6)) +
                              "|" +
                              t.getInt(7) +
                              "|" +
                              esc(t.getString(8)) +
                              "\n"
                          );
                      }

                      t.close();

                      Cursor h =
                          db.allHistory();

                      while (h.moveToNext()) {

                          w.write(
                              "HISTORY|" +
                              h.getLong(0) +
                              "|" +
                              h.getLong(1) +
                              "|" +
                              esc(h.getString(2)) +
                              "|" +
                              esc(h.getString(3)) +
                              "|" +
                              esc(h.getString(4)) +
                              "|" +
                              esc(h.getString(5)) +
                              "\n"
                          );
                      }

                      h.close();

                      w.close();

                      Toast.makeText(
                          this,
                          "پشتیبان ذخیره شد:\n" +
                          file.getAbsolutePath(),
                          Toast.LENGTH_LONG
                      ).show();

                  } catch(Exception e) {

                      Toast.makeText(
                          this,
                          "خطا در پشتیبان‌گیری",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              String esc(String s) {

                  if (s == null)
                      return "";

                  return s
                      .replace("\\","\\\\")
                      .replace("|","\\|")
                      .replace("\n","\\n");
              }

