              void createPdf(
                  String filename,
                  String text
              ) {

                  try {

                      PdfDocument pdf =
                          new PdfDocument();

                      PdfDocument.PageInfo info =
                          new PdfDocument.PageInfo.Builder(
                              595,
                              842,
                              1
                          ).create();

                      PdfDocument.Page page =
                          pdf.startPage(info);

                      Canvas canvas =
                          page.getCanvas();

                      Paint paint =
                          new Paint();

                      paint.setColor(
                          Color.BLACK
                      );

                      paint.setTextSize(15);

                      int y = 40;

                      String[] lines =
                          text.split("\n");

                      for (String line : lines) {

                          if (y > 800) {

                              pdf.finishPage(page);

                              info =
                                  new PdfDocument.PageInfo.Builder(
                                      595,
                                      842,
                                      pdf.getPages().size()+1
                                  ).create();

                              page =
                                  pdf.startPage(info);

                              canvas =
                                  page.getCanvas();

                              y = 40;
                          }

                          canvas.drawText(
                              line,
                              40,
                              y,
                              paint
                          );

                          y += 22;
                      }

                      pdf.finishPage(page);

                      File dir =
                          getExternalFilesDir(
                              "pdf"
                          );

                      if (!dir.exists())
                          dir.mkdirs();

                      File file =
                          new File(
                              dir,
                              filename
                          );

                      FileOutputStream out =
                          new FileOutputStream(file);

                      pdf.writeTo(out);

                      out.close();
                      pdf.close();

                      Toast.makeText(
                          this,
                          "PDF ساخته شد:\n" +
                          file.getAbsolutePath(),
                          Toast.LENGTH_LONG
                      ).show();

                      Intent share =
                          new Intent(
                              Intent.ACTION_SEND
                          );

                      share.setType(
                          "application/pdf"
                      );

                      share.putExtra(
                          Intent.EXTRA_STREAM,
                          Uri.fromFile(file)
                      );

                      try {
                          startActivity(
                              Intent.createChooser(
                                  share,
                                  "ارسال PDF"
                              )
                          );
                      } catch(Exception ignored) {}

                  } catch(Exception e) {

                      Toast.makeText(
                          this,
                          "خطا در ساخت PDF",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              String safe(String s) {

                  if (s == null ||
                      s.trim().isEmpty())
                      return "-";

                  return s;
              }

              class DB
                  extends SQLiteOpenHelper {

                  DB(Context c) {
                      super(
                          c,
                          "daftar.db",
                          null,
                          20
                      );
                  }

                  public void onCreate(
                      SQLiteDatabase d
                  ) {

                      d.execSQL(
                          "CREATE TABLE tasks (" +
                          "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                          "title TEXT," +
                          "description TEXT," +
                          "category TEXT," +
                          "tags TEXT," +
                          "created TEXT," +
                          "due TEXT," +
                          "done INTEGER DEFAULT 0," +
                          "doneDate TEXT)"
                      );

                      d.execSQL(
                          "CREATE TABLE history (" +
                          "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                          "task_id INTEGER," +
                          "date TEXT," +
                          "detail TEXT," +
                          "result TEXT," +
                          "next TEXT)"
                      );
                  }

                  public void onUpgrade(
                      SQLiteDatabase d,
                      int oldVersion,
                      int newVersion
                  ) {

                      if (oldVersion < 20) {

                          d.execSQL(
                              "DROP TABLE IF EXISTS history"
                          );

                          d.execSQL(
                              "DROP TABLE IF EXISTS tasks"
                          );

                          onCreate(d);
                      }
                  }

                  long addTask(
                      String title,
                      String desc,
                      String category,
                      String tags,
                      String created,
                      String due
                  ) {

                      ContentValues v =
                          new ContentValues();

                      v.put("title", title);
                      v.put("description", desc);
                      v.put("category", category);
                      v.put("tags", tags);
                      v.put("created", created);
                      v.put("due", due);
                      v.put("done", 0);
                      v.put("doneDate", "");

                      return getWritableDatabase()
                          .insert(
                              "tasks",
                              null,
                              v
                          );
                  }

                  void updateTask(
                      long id,
                      String title,
                      String desc,
                      String category,
                      String tags,
                      String due
                  ) {

                      ContentValues v =
                          new ContentValues();

                      v.put("title", title);
                      v.put("description", desc);
                      v.put("category", category);
                      v.put("tags", tags);
                      v.put("due", due);

                      getWritableDatabase()
                          .update(
                              "tasks",
                              v,
                              "id=?",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  long addFollow(
                      long task,
                      String date,
                      String detail,
                      String result,
                      String next
                  ) {

                      ContentValues v =
                          new ContentValues();

                      v.put("task_id", task);
                      v.put("date", date);
                      v.put("detail", detail);
                      v.put("result", result);
                      v.put("next", next);

                      return getWritableDatabase()
                          .insert(
                              "history",
                              null,
                              v
                          );
                  }

                  void updateFollow(
                      long id,
                      String date,
                      String detail,
                      String result,
                      String next
                  ) {

                      ContentValues v =
                          new ContentValues();

                      v.put("date", date);
                      v.put("detail", detail);
                      v.put("result", result);
                      v.put("next", next);

                      getWritableDatabase()
                          .update(
                              "history",
                              v,
                              "id=?",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  void archive(long id) {

                      ContentValues v =
                          new ContentValues();

                      v.put("done", 1);

                      v.put(
                          "doneDate",
                          nowShamsi()
                      );

                      getWritableDatabase()
                          .update(
                              "tasks",
                              v,
                              "id=?",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  void restore(long id) {

                      ContentValues v =
                          new ContentValues();

                      v.put("done", 0);
                      v.put("doneDate", "");

                      getWritableDatabase()
                          .update(
                              "tasks",
                              v,
                              "id=?",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  Cursor activeTasks() {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM tasks " +
                              "WHERE done=0 " +
                              "ORDER BY id DESC",
                              null
                          );
                  }

                  Cursor archived() {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM tasks " +
                              "WHERE done=1 " +
                              "ORDER BY id DESC",
                              null
                          );
                  }

                  Cursor allTasks() {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM tasks " +
                              "ORDER BY id DESC",
                              null
                          );
                  }

                  Cursor allHistory() {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM history " +
                              "ORDER BY id DESC",
                              null
                          );
                  }

                  Cursor topic(long id) {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM tasks " +
                              "WHERE id=?",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  Cursor history(long id) {

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT * FROM history " +
                              "WHERE task_id=? " +
                              "ORDER BY id DESC",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );
                  }

                  String lastFollow(long id) {

                      Cursor c =
                          getReadableDatabase()
                          .rawQuery(
                              "SELECT date FROM history " +
                              "WHERE task_id=? " +
                              "ORDER BY id DESC " +
                              "LIMIT 1",
                              new String[]{
                                  String.valueOf(id)
                              }
                          );

                      String result = "";

                      if (c.moveToFirst())
                          result =
                              c.getString(0);

                      c.close();

                      return result;
                  }

                  Cursor search(String q) {

                      String x =
                          "%" + q + "%";

                      return getReadableDatabase()
                          .rawQuery(
                              "SELECT DISTINCT " +
                              "t.id,t.title," +
                              "t.description," +
                              "t.category," +
                              "t.tags," +
                              "t.created," +
                              "t.due " +
                              "FROM tasks t " +
                              "LEFT JOIN history h " +
                              "ON t.id=h.task_id " +
                              "WHERE t.done=0 AND (" +
                              "t.title LIKE ? OR " +
                              "t.description LIKE ? OR " +
                              "t.category LIKE ? OR " +
                              "t.tags LIKE ? OR " +
                              "h.detail LIKE ? OR " +
                              "h.result LIKE ?)",
                              new String[]{
                                  x,x,x,x,x,x
                              }
                          );
                  }

                  Cursor followList(
                      String mode
                  ) {

                      Cursor result;

                      /*
                       * برای تاریخ شمسی، نمایش با تاریخ شمسی
                       * انجام می‌شود. فهرست‌ها بر اساس تاریخ
                       * ثبت‌شده در پیگیری بررسی می‌شوند.
                       */

                      if (mode.equals("today")) {

                          result =
                              getReadableDatabase()
                              .rawQuery(
                                  "SELECT DISTINCT " +
                                  "t.id,t.title,h.next " +
                                  "FROM tasks t " +
                                  "JOIN history h " +
                                  "ON t.id=h.task_id " +
                                  "WHERE t.done=0 " +
                                  "AND h.next=? " +
                                  "ORDER BY h.next",
                                  new String[]{
                                      todayShamsi()
                                  }
                              );

                      } else {

                          result =
                              getReadableDatabase()
                              .rawQuery(
                                  "SELECT DISTINCT " +
                                  "t.id,t.title,h.next " +
                                  "FROM tasks t " +
                                  "JOIN history h " +
                                  "ON t.id=h.task_id " +
                                  "WHERE t.done=0 " +
                                  "AND h.next<>'' " +
                                  "ORDER BY h.next",
                                  null
                              );
                      }

                      return result;
                  }
              }
          }
