name: Build Daftar Peygiri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/daftar/peygiri
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DaftarPeygiri"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.daftar.peygiri'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.daftar.peygiri'
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName '20.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">دفتر پیگیری امور</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/daftar/peygiri/MainActivity.java <<'EOF'
          package com.daftar.peygiri;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.database.*;
          import android.database.sqlite.*;
          import android.graphics.*;
          import android.graphics.pdf.PdfDocument;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.text.*;
          import java.util.*;

          public class MainActivity extends Activity {

              LinearLayout root;
              DB db;

              final int BLUE = Color.rgb(21,101,192);
              final int RED = Color.rgb(198,40,40);
              final int ORANGE = Color.rgb(239,108,0);
              final int GREEN = Color.rgb(46,125,50);
              final int GRAY = Color.rgb(245,245,245);

              SharedPreferences prefs;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  db = new DB(this);
                  prefs = getSharedPreferences("settings", MODE_PRIVATE);

                  home();
              }

              TextView title(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(22);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setPadding(10,24,10,24);
                  t.setBackgroundColor(BLUE);
                  return t;
              }

              TextView label(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(16);
                  t.setTextColor(Color.DKGRAY);
                  t.setPadding(16,10,16,10);
                  return t;
              }

              EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setPadding(16,8,16,8);
                  return e;
              }

              Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(16);
                  return b;
              }

              void base() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              String nowMiladi() {
                  return new SimpleDateFormat(
                      "yyyy-MM-dd HH:mm",
                      Locale.US
                  ).format(new Date());
              }

              String todayMiladi() {
                  return new SimpleDateFormat(
                      "yyyy-MM-dd",
                      Locale.US
                  ).format(new Date());
              }

              String nowShamsi() {
                  Calendar c = Calendar.getInstance();
                  return jalaliDate(
                      c.get(Calendar.YEAR),
                      c.get(Calendar.MONTH) + 1,
                      c.get(Calendar.DAY_OF_MONTH)
                  ) + " " +
                  new SimpleDateFormat(
                      "HH:mm",
                      Locale.US
                  ).format(new Date());
              }

              String todayShamsi() {
                  Calendar c = Calendar.getInstance();
                  return jalaliDate(
                      c.get(Calendar.YEAR),
                      c.get(Calendar.MONTH) + 1,
                      c.get(Calendar.DAY_OF_MONTH)
                  );
              }

              String jalaliDate(int gy, int gm, int gd) {
                  int[] gdm = {
                      0,31,28,31,30,31,30,31,31,30,31,30,31
                  };

                  int gy2 = gy - 1600;
                  int gm2 = gm - 1;
                  int gd2 = gd - 1;

                  int gDayNo = 365 * gy2
                      + (gy2 + 3) / 4
                      - (gy2 + 99) / 100
                      + (gy2 + 399) / 400;

                  for (int i = 0; i < gm2; ++i)
                      gDayNo += gdm[i + 1];

                  if (gm2 > 1 &&
                      ((gy % 4 == 0 && gy % 100 != 0) ||
                       (gy % 400 == 0))) {
                      gDayNo++;
                  }

                  gDayNo += gd2;

                  int jDayNo = gDayNo - 79;

                  int jNp = jDayNo / 12053;
                  jDayNo %= 12053;

                  int jy = 979 + 33 * jNp
                      + 4 * (jDayNo / 1461);

                  jDayNo %= 1461;

                  if (jDayNo >= 366) {
                      jy += (jDayNo - 1) / 365;
                      jDayNo = (jDayNo - 1) % 365;
                  }

                  int jm;
                  if (jDayNo < 186) {
                      jm = 1 + jDayNo / 31;
                  } else {
                      jm = 7 + (jDayNo - 186) / 30;
                  }

                  int jd;
                  if (jDayNo < 186) {
                      jd = 1 + jDayNo % 31;
                  } else {
                      jd = 1 + (jDayNo - 186) % 30;
                  }

                  return String.format(
                      Locale.US,
                      "%04d/%02d/%02d",
                      jy,jm,jd
                  );
              }

              String normalizeDigits(String s) {
                  if (s == null) return "";

                  return s
                      .replace('۰','0')
                      .replace('۱','1')
                      .replace('۲','2')
                      .replace('۳','3')
                      .replace('۴','4')
                      .replace('۵','5')
                      .replace('۶','6')
                      .replace('۷','7')
                      .replace('۸','8')
                      .replace('۹','9');
              }

              void home() {
                  base();

                  root.addView(title("دفتر پیگیری امور"));

                  LinearLayout menu =
                      new LinearLayout(this);

                  menu.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  menu.setPadding(10,10,10,10);

                  Button today =
                      button("🔴  پیگیری امروز");

                  Button late =
                      button("⚠️  عقب‌افتاده");

                  Button future =
                      button("🔵  آینده");

                  Button all =
                      button("📋  همه موضوعات");

                  Button add =
                      button("➕  ثبت موضوع جدید");

                  Button mainMenu =
                      button("☰  منوی برنامه");

                  menu.addView(today);
                  menu.addView(late);
                  menu.addView(future);
                  menu.addView(all);
                  menu.addView(add);
                  menu.addView(mainMenu);

                  root.addView(menu);

                  root.addView(
                      label("──── آخرین کارهای فعال ────")
                  );

                  Cursor c = db.activeTasks();

                  if (!c.moveToFirst()) {

                      root.addView(
                          label(
                              "هنوز موضوع فعالی ثبت نشده است."
                          )
                      );

                  } else {

                      do {
                          addHomeCard(c);
                      } while (c.moveToNext());
                  }

                  c.close();

                  today.setOnClickListener(
                      v -> listPage("today")
                  );

                  late.setOnClickListener(
                      v -> listPage("late")
                  );

                  future.setOnClickListener(
                      v -> listPage("future")
                  );

                  all.setOnClickListener(
                      v -> allTopics()
                  );

                  add.setOnClickListener(
                      v -> addTopic()
                  );

                  mainMenu.setOnClickListener(
                      v -> menuPage()
                  );
              }

              void addHomeCard(Cursor c) {

                  long id = c.getLong(0);
                  String name = c.getString(1);
                  String category = c.getString(3);
                  String tags = c.getString(4);
                  String due = c.getString(6);

                  String last = db.lastFollow(id);

                  LinearLayout box =
                      new LinearLayout(this);

                  box.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  box.setPadding(8,8,8,8);
                  box.setBackgroundColor(GRAY);

                  TextView n =
                      label("📌 " + name);

                  n.setTextSize(18);
                  n.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  box.addView(n);

                  box.addView(
                      label(
                          "📁 " + safe(category) +
                          "\n🏷 " + safe(tags) +
                          "\n📅 پیگیری بعدی: " +
                          safe(due) +
                          "\n⏱ آخرین پیگیری: " +
                          lastFollowText(last)
                      )
                  );

                  Button open =
                      button("مشاهده");

                  box.addView(open);

                  root.addView(box);

                  open.setOnClickListener(
                      v -> topicPage(id)
                  );
              }

              String lastFollowText(String last) {

                  if (last == null ||
                      last.trim().isEmpty()) {

                      return "هنوز ثبت نشده";
                  }

                  return last +
                      " (" +
                      timeAgo(last) +
                      ")";
              }

              String timeAgo(String date) {

                  try {

                      String normalized =
                          normalizeDigits(date);

                      SimpleDateFormat f =
                          new SimpleDateFormat(
                              "yyyy-MM-dd HH:mm",
                              Locale.US
                          );

                      Date d = f.parse(normalized);

                      if (d == null)
                          return "نامشخص";

                      long diff =
                          System.currentTimeMillis()
                          - d.getTime();

                      if (diff < 0)
                          return "آینده";

                      long minutes =
                          diff / 60000;

                      if (minutes < 1)
                          return "کمتر از یک دقیقه قبل";

                      if (minutes < 60)
                          return minutes +
                              " دقیقه قبل";

                      long hours =
                          minutes / 60;

                      if (hours < 24)
                          return hours +
                              " ساعت قبل";

                      long days =
                          hours / 24;

                      return days +
                          " روز قبل";

                  } catch(Exception e) {
                      return "نامشخص";
                  }
              }

              void addTopic() {

                  base();

                  root.addView(
                      title("ثبت موضوع جدید")
                  );

                  EditText name =
                      field("عنوان موضوع");

                  EditText desc =
                      field("توضیحات");

                  EditText category =
                      field("دسته‌بندی");

                  EditText tags =
                      field("تگ‌ها");

                  EditText due =
                      field(
                          "تاریخ و ساعت پیگیری بعدی"
                      );

                  root.addView(
                      label(
                          "تاریخ و ساعت ثبت: " +
                          nowShamsi()
                      )
                  );

                  root.addView(name);
                  root.addView(desc);
                  root.addView(category);
                  root.addView(tags);
                  root.addView(due);

                  CheckBox reminder =
                      new CheckBox(this);

                  reminder.setText(
                      "🔔 یادآور برای پیگیری بعدی"
                  );

                  root.addView(reminder);

                  Button save =
                      button("💾 ذخیره موضوع");

                  Button back =
                      button("بازگشت");

                  root.addView(save);
                  root.addView(back);

                  final long[] savedId =
                      {-1};

                  TextWatcherSaver saver =
                      new TextWatcherSaver(
                          () -> {

                              String n =
                                  name.getText()
                                      .toString()
                                      .trim();

                              if (n.isEmpty())
                                  return;

                              if (savedId[0] == -1) {

                                  savedId[0] =
                                      db.addTask(
                                          n,
                                          desc.getText().toString(),
                                          category.getText().toString(),
                                          tags.getText().toString(),
                                          nowShamsi(),
                                          due.getText().toString()
                                      );

                              } else {

                                  db.updateTask(
                                      savedId[0],
                                      n,
                                      desc.getText().toString(),
                                      category.getText().toString(),
                                      tags.getText().toString(),
                                      due.getText().toString()
                                  );
                              }
                          }
                      );

                  name.addTextChangedListener(saver);
                  desc.addTextChangedListener(saver);
                  category.addTextChangedListener(saver);
                  tags.addTextChangedListener(saver);
                  due.addTextChangedListener(saver);

                  save.setOnClickListener(v -> {

                      saver.save();

                      if (savedId[0] != -1) {

                          Toast.makeText(
                              this,
                              "موضوع ذخیره شد",
                              Toast.LENGTH_SHORT
                          ).show();

                          topicPage(savedId[0]);

                      } else {

                          Toast.makeText(
                              this,
                              "عنوان موضوع را وارد کنید",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  back.setOnClickListener(v -> {

                      saver.save();

                      home();
                  });
              }

              class TextWatcherSaver
                  implements android.text.TextWatcher {

                  Runnable action;

                  boolean busy = false;

                  TextWatcherSaver(Runnable r) {
                      action = r;
                  }

                  void save() {

                      if (busy) return;

                      busy = true;

                      try {
                          action.run();
                      } finally {
                          busy = false;
                      }
                  }

                  public void beforeTextChanged(
                      CharSequence s,
                      int st,
                      int c,
                      int a) {}

                  public void onTextChanged(
                      CharSequence s,
                      int st,
                      int before,
                      int count) {

                      save();
                  }

                  public void afterTextChanged(
                      android.text.Editable e) {}
              }

              void topicPage(long id) {

                  base();

                  Cursor c =
                      db.topic(id);

                  if (!c.moveToFirst()) {
                      home();
                      return;
                  }

                  String name = c.getString(1);
                  String desc = c.getString(2);
                  String category = c.getString(3);
                  String tags = c.getString(4);
                  String created = c.getString(5);
                  String due = c.getString(6);

                  c.close();

                  root.addView(title(name));

                  root.addView(
                      label(
                          "📁 دسته: " +
                          safe(category) +

                          "\n🏷 تگ: " +
                          safe(tags) +

                          "\n📅 ثبت: " +
                          safe(created) +

                          "\n🔔 پیگیری بعدی: " +
                          safe(due)
                      )
                  );

                  root.addView(
                      label(
                          "توضیحات:\n" +
                          safe(desc)
                      )
                  );

                  root.addView(
                      label(
                          "──── سوابق پیگیری ────"
                      )
                  );

                  Cursor h =
                      db.history(id);

                  if (!h.moveToFirst()) {

                      root.addView(
                          label(
                              "هنوز پیگیری‌ای ثبت نشده است."
                          )
                      );

                  } else {

                      do {

                          root.addView(
                              label(
                                  "📅 " +
                                  safe(h.getString(2)) +

                                  "\n📝 " +
                                  safe(h.getString(3)) +

                                  "\nنتیجه: " +
                                  safe(h.getString(4)) +

                                  "\nپیگیری بعدی: " +
                                  safe(h.getString(5))
                              )
                          );

                      } while (h.moveToNext());
                  }

                  h.close();

                  Button follow =
                      button("➕ ثبت پیگیری");

                  Button share =
                      button("📤 اشتراک‌گذاری");

                  Button pdf =
                      button("📄 خروجی PDF سوابق");

                  Button archive =
                      button(
                          "☑️ انجام شد و انتقال به بایگانی"
                      );

                  Button back =
                      button("بازگشت");

                  root.addView(follow);
                  root.addView(share);
                  root.addView(pdf);
                  root.addView(archive);
                  root.addView(back);

                  follow.setOnClickListener(
                      v -> addFollow(id)
                  );

                  share.setOnClickListener(
                      v -> shareTopic(id)
                  );

                  pdf.setOnClickListener(
                      v -> makeTopicPdf(id)
                  );

                  archive.setOnClickListener(v -> {

                      db.archive(id);

                      Toast.makeText(
                          this,
                          "موضوع به بایگانی منتقل شد",
                          Toast.LENGTH_SHORT
                      ).show();

                      home();
                  });

                  back.setOnClickListener(
                      v -> home()
                  );
              }

              void addFollow(long id) {

                  base();

                  root.addView(
                      title("ثبت پیگیری")
                  );

                  EditText date =
                      field("تاریخ شمسی");

                  EditText time =
                      field("ساعت");

                  EditText detail =
                      field(
                          "شرح پیگیری - اختیاری"
                      );

                  EditText result =
                      field(
                          "نتیجه - اختیاری"
                      );

                  EditText next =
                      field(
                          "پیگیری بعدی - اختیاری"
                      );

                  date.setText(todayShamsi());

                  time.setText(
                      new SimpleDateFormat(
                          "HH:mm",
                          Locale.US
                      ).format(new Date())
                  );

                  root.addView(date);
                  root.addView(time);
                  root.addView(detail);
                  root.addView(result);
                  root.addView(next);

                  CheckBox reminder =
                      new CheckBox(this);

                  reminder.setText(
                      "🔔 یادآور پیگیری بعدی"
                  );

                  root.addView(reminder);

                  Button save =
                      button("💾 ذخیره پیگیری");

                  Button back =
                      button("بازگشت");

                  root.addView(save);
                  root.addView(back);

                  final long[] saved =
                      {-1};

                  TextWatcherSaver saver =
                      new TextWatcherSaver(
                          () -> {

                              String d =
                                  date.getText()
                                      .toString()
                                      .trim();

                              String tm =
                                  time.getText()
                                      .toString()
                                      .trim();

                              if (d.isEmpty())
                                  return;

                              String dt =
                                  d + " " + tm;

                              if (saved[0] == -1) {

                                  saved[0] =
                                      db.addFollow(
                                          id,
                                          dt,
                                          detail.getText().toString(),
                                          result.getText().toString(),
                                          next.getText().toString()
                                      );

                              } else {

                                  db.updateFollow(
                                      saved[0],
                                      dt,
                                      detail.getText().toString(),
                                      result.getText().toString(),
                                      next.getText().toString()
                                  );
                              }
                          }
                      );

                  date.addTextChangedListener(saver);
                  time.addTextChangedListener(saver);
                  detail.addTextChangedListener(saver);
                  result.addTextChangedListener(saver);
                  next.addTextChangedListener(saver);

                  save.setOnClickListener(v -> {

                      saver.save();

                      Toast.makeText(
                          this,
                          "پیگیری ذخیره شد",
                          Toast.LENGTH_SHORT
                      ).show();

                      topicPage(id);
                  });

                  back.setOnClickListener(v -> {

                      saver.save();

                      topicPage(id);
                  });
              }

              void allTopics() {

                  base();

                  root.addView(
                      title("📋 همه موضوعات")
                  );

                  EditText search =
                      field("🔍 جستجوی موضوع");

                  root.addView(search);

                  LinearLayout list =
                      new LinearLayout(this);

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.addView(list);

                  showAll(list, "");

                  search.addTextChangedListener(
                      new android.text.TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int st,
                              int c,
                              int a) {}

                          public void onTextChanged(
                              CharSequence s,
                              int st,
                              int before,
                              int count) {

                              list.removeAllViews();

                              showAll(
                                  list,
                                  s.toString()
                              );
                          }

                          public void afterTextChanged(
                              android.text.Editable e) {}
                      }
                  );

                  Button pdf =
                      button("📄 خروجی PDF کل موضوعات");

                  Button back =
                      button("بازگشت");

                  root.addView(pdf);
                  root.addView(back);

                  pdf.setOnClickListener(
                      v -> makeAllPdf()
                  );

                  back.setOnClickListener(
                      v -> home()
                  );
              }

              void showAll(
                  LinearLayout list,
                  String query
              ) {

                  Cursor c =
                      db.search(query);

                  if (!c.moveToFirst()) {

                      list.addView(
                          label("موضوعی پیدا نشد.")
                      );

                  } else {

                      do {

                          long id =
                              c.getLong(0);

                          String name =
                              c.getString(1);

                          String last =
                              db.lastFollow(id);

                          String category =
                              c.getString(3);

                          String tags =
                              c.getString(4);

                          LinearLayout box =
                              new LinearLayout(this);

                          box.setOrientation(
                              LinearLayout.VERTICAL
                          );

                          box.setPadding(
                              10,10,10,10
                          );

                          box.setBackgroundColor(
                              GRAY
                          );

                          TextView n =
                              label(
                                  "📌 " + name
                              );

                          n.setTextSize(18);

                          n.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                          );

                          box.addView(n);

                          box.addView(
                              label(
                                  "📁 دسته: " +
                                  safe(category) +

                                  "\n🏷 تگ: " +
                                  safe(tags) +

                                  "\n⏱ آخرین پیگیری: " +
                                  lastFollowText(last)
                              )
                          );

                          Button open =
                              button("مشاهده موضوع");

                          box.addView(open);

                          list.addView(box);

                          open.setOnClickListener(
                              v -> topicPage(id)
                          );

                      } while (c.moveToNext());
                  }

                  c.close();
              }

              void listPage(String mode) {

                  base();

                  String head;

                  if (mode.equals("today")) {
                      head = "🔴 پیگیری امروز";
                  } else if (mode.equals("late")) {
                      head = "⚠️ پیگیری‌های عقب‌افتاده";
                  } else {
